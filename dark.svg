      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="12" y="12" width="1156" height="586" rx="24"/></clipPath>
  </defs>
